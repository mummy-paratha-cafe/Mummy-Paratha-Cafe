<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF9E3B" />
      <stop offset="60%" stop-color="#FF8A1F" />
      <stop offset="100%" stop-color="#D95700" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" />
      <stop offset="50%" stop-color="#FFC83D" />
      <stop offset="100%" stop-color="#E59B00" />
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C68642" />
      <stop offset="50%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#A66428" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="80" cy="80" r="76" fill="#141414" stroke="url(#goldRing)" stroke-width="4" filter="url(#softShadow)" />
  <circle cx="80" cy="80" r="68" fill="url(#bgGlow)" />

  <!-- Radiating warmth dots -->
  <circle cx="80" cy="80" r="62" fill="none" stroke="#FFE9C2" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6" />

  <!-- Chef Mascot Body / Apron -->
  <path d="M 52 135 C 52 110, 60 98, 80 98 C 100 98, 108 110, 108 135 Z" fill="#FDFBF7" stroke="#FFE6CC" stroke-width="2" />
  <!-- Apron strap & bib -->
  <path d="M 66 100 L 70 115 L 90 115 L 94 100 Z" fill="#FF8A1F" opacity="0.9" />

  <!-- Rolling Pin (Belan) angled held proudly -->
  <g transform="rotate(-26 80 114)">
    <!-- Main Roller -->
    <rect x="42" y="110" width="76" height="13" rx="6.5" fill="url(#wood)" stroke="#7A4215" stroke-width="1.2" />
    <!-- Left Handle -->
    <rect x="28" y="113.5" width="14" height="6" rx="3" fill="#8C4E1A" />
    <!-- Right Handle -->
    <rect x="118" y="113.5" width="14" height="6" rx="3" fill="#8C4E1A" />
    <!-- Center Wood Ring Detail -->
    <line x1="55" y1="110" x2="55" y2="123" stroke="#A66428" stroke-width="1" opacity="0.5" />
    <line x1="105" y1="110" x2="105" y2="123" stroke="#A66428" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Mummy's Face & Smile -->
  <circle cx="80" cy="74" r="22" fill="#FCE5CE" />
  <!-- Hair locks -->
  <path d="M 58 72 C 58 60, 68 54, 80 54 C 92 54, 102 60, 102 72 C 102 65, 96 61, 80 61 C 64 61, 58 65, 58 72 Z" fill="#3D2314" />
  <!-- Happy Closed Eyes -->
  <path d="M 69 72 Q 74 76 77 72" fill="none" stroke="#4A2610" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 83 72 Q 86 76 91 72" fill="none" stroke="#4A2610" stroke-width="2.5" stroke-linecap="round" />
  <!-- Traditional Red Bindi -->
  <circle cx="80" cy="65" r="2.2" fill="#D32F2F" />
  <!-- Cheerful Smile -->
  <path d="M 73 82 Q 80 89 87 82" fill="none" stroke="#C2185B" stroke-width="2.2" stroke-linecap="round" />
  <!-- Warm Rosy Cheeks -->
  <circle cx="68" cy="79" r="4.5" fill="#FF8A80" opacity="0.45" />
  <circle cx="92" cy="79" r="4.5" fill="#FF8A80" opacity="0.45" />

  <!-- Chef Hat (Toque Blanche) -->
  <g>
    <!-- Hat Puffs -->
    <circle cx="67" cy="45" r="14" fill="#FFFFFF" />
    <circle cx="93" cy="45" r="14" fill="#FFFFFF" />
    <circle cx="80" cy="38" r="17" fill="#FFFFFF" />
    <!-- Hat Base Band -->
    <path d="M 64 53 L 96 53 L 94 62 L 66 62 Z" fill="#F5F0EA" stroke="#E3DCD2" stroke-width="1.5" />
    <!-- Golden Wheat/Star in Hat Band -->
    <circle cx="80" cy="57.5" r="2" fill="#FFC83D" />
  </g>
</svg>
